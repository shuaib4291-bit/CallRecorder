name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CallRecorder.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          build-root-directory: CallRecorder
      - run: gradle assembleDebug
        working-directory: CallRecorder
      - uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-APK
          path: CallRecorder/app/build/outputs/apk/debug/app-debug.apk
